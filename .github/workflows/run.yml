name: Cloud check in action
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # UTC 02:35 / 14:35，对应北京时间 10:35 / 22:35
    # 两个时间点互为备用，避免单次定时事件被丢弃后整天不执行
    - cron: 35 2 * * *
    - cron: 35 14 * * *
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@main

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@main
        with:
          node-version: 18
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV

      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ github.run_id }}
          restore-keys: cloud189-token-

      - name: 🔧 Init secrets
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
          TY_FAMILIES: ${{ secrets.TY_FAMILIES }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          {
            echo "TY_ACCOUNTS=$TY_ACCOUNTS"
            echo "TY_FAMILIES=$TY_FAMILIES"
            echo "SENDKEY=$SENDKEY"
          } > .env

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚀 Run
        uses: nick-fields/retry@master
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start

      - name: 📹 Save cached Cookie
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .token
          key: cloud189-token-${{ github.run_id }}

      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push
